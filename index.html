<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>장치 제어판</title>
  <!-- Supabase 라이브러리 불러오기 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>ESP32 & Unity 제어판</h1>
  <button onclick="changeStatus('ON')">켜기 (ON)</button>
  <button onclick="changeStatus('OFF')">끄기 (OFF)</button>

  <p>현재 상태: <span id="current-status">-</span></p>

  <script>
    // 1단계에서 복사한 값으로 수정하세요
    const SUPABASE_URL = 'https://daqmyuwjmqhrjwlomizo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Rt5hF5FjGJ9WAhm3rGKmBg_f7_T6yoG';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 버튼 누르면 DB 상태 업데이트
    async function changeStatus(newStatus) {
      const { error } = await supabaseClient
        .from('device_control')
        .update({ status: newStatus })
        .eq('id', 1);

      if (error) alert('Error: ' + error.message);
      else document.getElementById('current-status').innerText = newStatus;
    }
  </script>
</body>
</html>
